name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies from public npm registry
        run: |
          rm -f package-lock.json
          npm install --no-package-lock --registry=https://registry.npmjs.org
      - run: npm run check
